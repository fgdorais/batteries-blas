name = "«lean4-blas»"
defaultTargets = ["BLAS", "BLASTest", "BLASCompat", "bench"]
testDriver = "BLASTest"

# Linters that are off by default.
leanOptions = { linter.missingDocs = true, linter.extra = true }

# Pins an exact scalar-arrays release.
[[require]]
name = "lean4-scalar-arrays"
git = "https://github.com/fgdorais/lean4-scalar-arrays"
rev = "v2.0.0"

# As a Batteries cell, it builds against Batteries: `main` here, `nightly-testing` on the
# `nightly-testing` branch. The library doesn't import it; `BLASCompat` checks that the two can be
# imported together.
[[require]]
name = "batteries"
git = "https://github.com/leanprover-community/batteries"
rev = "main"

[[lean_lib]]
name = "BLAS"
# `BLAS.Notation` is not imported by the root `BLAS`, so it needs its own glob.
globs = ["BLAS", "BLAS.Notation"]
# Lets the interpreter run scalar-arrays' `extern` C code in downstream files, for `#eval` and
# `#guard`.
precompileModules = true
# Aligns loops to 64 bytes, so that a loop's speed doesn't depend on where unrelated code shifts it.
moreLeancArgs = ["-falign-loops=64"]

[[lean_lib]]
name = "BLASTest"
precompileModules = true

# Imports Batteries together with all of `BLAS`, so that a clash of names fails the build. Not
# precompiled, so that Batteries isn't compiled to a shared library.
[[lean_lib]]
name = "BLASCompat"

# The modules of the `bench` exe, other than its root.
[[lean_lib]]
name = "BLASBenchLib"
globs = ["BLASBench.+"]
moreLeancArgs = ["-falign-loops=64"]

[[lean_exe]]
name = "bench"
root = "BLASBench"
# As for `BLAS`, since the benchmarked loops are mostly inlined here.
moreLeancArgs = ["-falign-loops=64"]
